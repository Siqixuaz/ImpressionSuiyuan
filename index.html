<!doctype html>
<html lang="zh-CN"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="印象随园，一本可以亲手整理的校园微影集。">
    <title>印象随园 · 校园微影集</title>
    <style>
      /* 视觉素材沿用南京师范大学官网；图片路径相对于本 HTML。 */

      /* 主题变量 */
      :root {
        --paper: #fff;
        --ink: #217050;
        --muted: #747b75;
        --line: #dbe8df;
        --gold: #cdab7f;
        --orange: #ff8359;
        --serif: 'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
        --sans: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      }

      /* 基础样式与按钮 */
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 32px;
      }

      body {
        margin: 0;
        color: #333;
        background: #fff;
        font: 14px var(--sans);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        color: inherit;
      }

      button:disabled {
        opacity: .4;
        cursor: default;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      a,
      input,
      textarea {
        touch-action: manipulation;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 4px;
      }

      [hidden] {
        display: none !important;
      }

      .plain {
        border: 0;
        background: none;
        padding: 8px;
      }

      .outline {
        background: transparent;
        border: 1px solid var(--ink);
        padding: 10px 18px;
        color: var(--ink);
      }

      .primary {
        background: var(--ink);
        border: 1px solid var(--ink);
        color: #fff;
        padding: 12px 20px;
      }

      /* 顶部导航与首屏基础样式 */
      header {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        z-index: 5;
        height: 126px;
        padding: 24px 4.2%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        background: linear-gradient(#0f3b31c9, transparent);
        border-top: 3px solid transparent;
        border-image: linear-gradient(90deg, #ff8359, #efc33e) 1;
        gap: 30px;
      }

      .brand {
        display: block;
        flex-shrink: 0;
      }

      .official-logo {
        display: block;
        width: 282px;
        height: auto;
        filter: brightness(0) invert(1);
      }

      .hero {
        height: 100svh;
        min-height: 660px;
        max-height: 1080px;
        position: relative;
        overflow: hidden;
        background: #164a37;
        color: white;
      }

      .hero>#cover {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 45%;
      }

      .hero:after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #082c2480, transparent 80%), linear-gradient(0deg, #092c21bd, transparent 55%);
        pointer-events: none;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 3px;
      }

      .hero h1 {
        font: clamp(54px, 5.3vw, 82px)/1.25 var(--serif);
        letter-spacing: .24em;
        margin: 20px 0 22px;
        text-shadow: 0 3px 18px #173c3460;
      }

      .hero .poem {
        font: 24px/1.8 var(--serif);
        letter-spacing: 4px;
      }

      .hero .enter {
        display: inline-flex;
        align-items: center;
        gap: 42px;
        margin-top: 22px;
        font-size: 13px;
        padding: 10px 0;
        border-bottom: 1px solid #ffffff70;
      }

      main {
        max-width: 1400px;
        margin: auto;
        padding: 0 5.5%;
        position: relative;
      }

      .tit-bg {
        position: absolute;
        left: 50%;
        top: 50%;
        max-width: 100%;
        max-height: 100%;
        transform: translate(-50%, -50%);
        z-index: -1;
      }

      .section-heading .eyebrow {
        color: #a58e6d;
        font-size: 10px;
        letter-spacing: 4px;
        text-align: center;
      }

      /* 照片筛选、卡片和分页 */
      #album {
        padding-top: 5px;
        position: relative;
      }

      .section-top {
        position: relative;
        margin: 8px 0 18px;
        min-height: 155px;
      }

      .section-heading {
        width: 100%;
      }

      .section-heading h2 {
        padding-top: 56px;
        height: 128px;
        font: bold 38px/1.1 var(--serif);
        text-align: center;
        color: #217050;
        position: relative;
        z-index: 1;
        margin: 0;
        letter-spacing: 3px;
      }

      .section-heading small {
        display: block;
        text-align: center;
        font-size: 10px;
        letter-spacing: 4px;
        color: #a58e6d;
      }

      .tools {
        z-index: 2;
        position: absolute;
        right: 0;
        top: 59px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .tools button {
        font-size: 13px;
        padding: 8px 12px;
      }

      .filterline {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 20px;
        margin-top: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .chip {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 11px 14px;
        font-size: 14px;
        color: #5c695f;
        white-space: nowrap;
      }

      .chip.active {
        border-bottom-color: var(--orange);
        color: #217050;
        font-weight: bold;
      }

      .chip:hover {
        color: #217050;
        background: #f1f7f2;
      }

      .chip span {
        font-size: 10px;
        font-weight: normal;
        color: #8d998b;
        margin-left: 7px;
      }

      .search {
        height: 39px;
        max-width: 210px;
        width: 100%;
        background: #f5f8f4;
        border: 1px solid #e1e9df;
        padding: 0 12px;
        color: #333;
      }

      .status {
        font-size: 12px;
        color: #909a8b;
        margin: 18px 0 26px;
        min-height: 18px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 28px;
        align-items: start;
      }

      .gallery figure {
        margin: 0;
        position: relative;
        min-width: 0;
        background: white;
        border-bottom: 1px solid #e8eee4;
        transition: box-shadow .25s, transform .25s;
      }

      .gallery figure:hover {
        box-shadow: 0 8px 30px #21705015;
        transform: translateY(-3px);
      }

      .photo-btn {
        display: block;
        padding: 0;
        border: 0;
        background: #e4ece1;
        width: 100%;
        aspect-ratio: 4/3;
        text-align: left;
        overflow: hidden;
        position: relative;
      }

      .photo-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform .7s;
      }

      .photo-btn:hover img {
        transform: scale(1.04);
      }

      .photo-btn:after {
        content: '查看照片 ↗';
        position: absolute;
        bottom: 14px;
        right: 14px;
        background: #217050e6;
        color: white;
        font-size: 11px;
        padding: 8px 12px;
        opacity: 0;
        transition: opacity .2s;
      }

      .photo-btn:hover:after,
      .photo-btn:focus-visible:after {
        opacity: 1;
      }

      .gallery figcaption {
        padding: 18px 12px 22px;
      }

      .photo-kicker {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: #b49a77;
        font-size: 10px;
        letter-spacing: 1px;
      }

      .tagtext {
        color: #79967e;
      }

      .photo-title {
        font: 22px/1.5 var(--serif);
        margin: 10px 0 0;
        color: #217050;
        overflow-wrap: anywhere;
        letter-spacing: 1px;
      }

      .photo-caption {
        font-size: 12px;
        line-height: 1.9;
        color: #7c8478;
        white-space: pre-line;
        overflow-wrap: anywhere;
        margin: 8px 0 0;
      }

      .filename {
        font-size: 10px;
        color: #98a08f;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 10px;
      }

      .edit-photo {
        background: none;
        border: 1px solid #cddbc9;
        padding: 7px 12px;
        font-size: 12px;
        color: #217050;
        margin-top: 12px;
      }

      .select-photo {
        display: none;
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        background: #fffffff2;
        padding: 8px;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #217050;
      }

      .editing .select-photo {
        display: flex;
      }

      .select-photo input {
        width: 17px;
        height: 17px;
        accent-color: #217050;
        margin: 0;
      }

      .editing figure:has(input:checked) {
        outline: 3px solid #cdab7f;
        outline-offset: 3px;
      }

      .batchbar {
        position: sticky;
        top: 10px;
        z-index: 10;
        padding: 13px 16px;
        margin-bottom: 24px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        background: #edf5ec;
        border: 1px solid #c7dac5;
        box-shadow: 0 4px 20px #21705012;
        color: #217050;
      }

      .batchbar button {
        padding: 7px 10px;
      }

      .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 65px 20px;
        border: 1px dashed #c3d6be;
        line-height: 2;
        color: #82917d;
      }

      .empty strong {
        display: block;
        color: #217050;
        font: 26px var(--serif);
        margin-bottom: 16px;
      }

      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        margin: 48px 0 65px;
        color: #217050;
        font-size: 12px;
      }

      .pagination button {
        border: 1px solid #d4e1ce;
        background: none;
        padding: 11px 22px;
        color: #217050;
      }

      .official-footer {
        background: #217050;
        color: white;
        position: relative;
        margin-top: 65px;
        padding: 46px 5.5% 0;
        display: block;
        border: 0;
      }

      .official-footer:before {
        content: '';
        position: absolute;
        top: -72px;
        left: 0;
        width: 100%;
        height: 74px;
        background: url('官网/d-footer-bg2.png') center bottom/auto 74px repeat-x;
        pointer-events: none;
      }

      .official-footer:after {
        content: '';
        position: absolute;
        top: -84px;
        left: 0;
        width: 100%;
        height: 84px;
        background: url('官网/d-footer-bg3.png') center bottom/auto 84px repeat-x;
        pointer-events: none;
        z-index: -1;
      }

      .footer-caption {
        border-top: 1px solid #ffffff30;
        padding: 22px 0;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        max-width: 1246px;
        margin: auto;
        font-size: 11px;
        color: #d0e0d3;
        line-height: 1.8;
      }

      .footer-caption small {
        font-size: 10px;
      }

      /* 大图浏览与整理弹窗 */
      dialog {
        border: 0;
        padding: 0;
        max-width: calc(100vw - 32px);
        color: #333;
        background: white;
      }

      dialog::backdrop {
        background: #061b14eb;
        backdrop-filter: blur(6px);
      }

      .lightbox {
        width: min(1440px, 96vw);
        height: 92svh;
        max-height: 1000px;
        overflow: hidden;
        background: #102b20;
        color: #eee;
      }

      .lightbox-inner {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .light-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 24px;
        gap: 15px;
        font-size: 12px;
      }

      .light-head button,
      .light-controls button {
        background: none;
        border: 1px solid #ffffff50;
        color: inherit;
        padding: 8px 14px;
      }

      .light-image {
        flex: 1;
        min-height: 0;
        width: 100%;
        object-fit: contain;
        padding: 0 30px;
      }

      .light-bottom {
        padding: 18px 25px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
      }

      .light-bottom h3 {
        font: 24px var(--serif);
        margin: 0 0 8px;
      }

      .light-bottom p {
        font-size: 12px;
        color: #b3c2b5;
        margin: 0;
        line-height: 1.8;
        max-width: 650px;
        white-space: pre-line;
        max-height: 65px;
        overflow: auto;
      }

      .light-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
      }

      .modal {
        width: 560px;
        padding: 30px;
        max-height: 90svh;
        border-top: 4px solid #217050;
      }

      .modal h2 {
        font: 25px var(--serif);
        margin: 0 0 12px;
        color: #217050;
      }

      .modal p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.9;
      }

      .formrow {
        display: block;
        margin: 22px 0;
        font-size: 12px;
      }

      .formrow input,
      .formrow textarea {
        display: block;
        width: 100%;
        padding: 11px;
        border: 1px solid #bec7b7;
        margin-top: 9px;
        background: #fff;
        color: #333;
      }

      .formrow textarea {
        min-height: 80px;
        resize: vertical;
      }

      .tagpicker {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 18px;
      }

      .tagpicker label {
        padding: 8px 10px;
        border: 1px solid var(--line);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .tagpicker input {
        accent-color: var(--ink);
      }

      .newtag {
        display: flex;
        gap: 8px;
      }

      .newtag input {
        min-width: 0;
        flex: 1;
        border: 1px solid var(--line);
        padding: 10px;
        background: white;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
      }

      .editor-image {
        height: 110px;
        width: 100%;
        object-fit: contain;
        margin-top: 5px;
        background: #edf3e9;
      }

      .hint {
        font-size: 11px;
        line-height: 1.8;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 13px 23px;
        z-index: 50;
        max-width: 90vw;
        text-align: center;
        font-size: 12px;
        box-shadow: 0 6px 30px #0002;
      }

      .toast:empty {
        display: none;
      }

      .error {
        padding: 20px;
        background: #ffe9ce;
        line-height: 1.8;
      }

      .no-scroll {
        overflow: hidden;
      }

      @media(max-width:1050px) {
        .official-logo {
          width: 245px;
        }

        header {
          padding-left: 4%;
          padding-right: 4%;
        }

        .gallery {
          gap: 22px;
        }

        .tools {
          position: static;
          justify-content: center;
          margin-top: 20px;
        }

        .section-top {
          margin-bottom: 20px;
        }

        .filterline {
          flex-direction: column;
          gap: 10px;
        }

        .search {
          max-width: 100%;
        }
      }

      @media(max-width:760px) {
        header {
          height: 110px;
          padding: 18px 5%;
          align-items: start;
        }

        .official-logo {
          width: 210px;
        }

        .hero {
          min-height: 600px;
          height: 86svh;
        }

        .hero h1 {
          font-size: 62px;
        }

        .hero .poem {
          font-size: 21px;
          letter-spacing: 3px;
        }

        .section-heading h2 {
          font-size: 32px;
        }

        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 22px 16px;
        }

        .photo-title {
          font-size: 19px;
        }

        .official-footer {
          padding-top: 24px;
        }
      }

      @media(max-width:480px) {
        header {
          height: 100px;
          gap: 12px;
          padding: 18px 5%;
        }

        .official-logo {
          width: 174px;
        }

        .hero {
          height: 88svh;
          min-height: 580px;
        }

        .hero h1 {
          font-size: 51px;
          letter-spacing: .16em;
        }

        .hero .eyebrow {
          font-size: 8px;
          letter-spacing: 1.8px;
        }

        .hero .poem {
          font-size: 17px;
          letter-spacing: 2px;
        }

        .hero .enter {
          font-size: 12px;
          margin-top: 15px;
        }

        .section-heading small {
          font-size: 8px;
          letter-spacing: 2px;
        }

        .section-heading h2 {
          font-size: 29px;
          letter-spacing: 2px;
        }

        .section-top {
          margin-top: 0;
        }

        .filters {
          gap: 0;
        }

        .chip {
          font-size: 12px;
          padding: 10px 11px;
        }

        .chip span {
          margin-left: 5px;
        }

        .status {
          font-size: 11px;
          margin-bottom: 18px;
        }

        .gallery {
          gap: 20px 12px;
        }

        .gallery figcaption {
          padding: 12px 6px 16px;
        }

        .photo-title {
          font-size: 17px;
          letter-spacing: 0;
        }

        .photo-kicker {
          font-size: 9px;
          flex-wrap: wrap;
          gap: 5px;
        }

        .photo-caption {
          font-size: 11px;
        }

        .batchbar {
          font-size: 11px;
          gap: 8px;
        }

        .batchbar button {
          font-size: 11px;
        }

        .pagination {
          gap: 16px;
          margin: 35px 0 45px;
        }

        .pagination button {
          padding: 9px 14px;
        }

        .footer-caption {
          flex-direction: column;
          gap: 8px;
          font-size: 10px;
        }

        .footer-caption small {
          font-size: 9px;
        }

        .lightbox {
          height: 94svh;
          max-width: 100vw;
          width: 100vw;
        }

        .light-image {
          padding: 0 8px;
        }

        .light-head {
          padding: 12px;
          font-size: 10px;
        }

        .light-bottom {
          flex-direction: column;
          align-items: stretch;
          padding: 16px;
        }

        .light-controls {
          justify-content: space-between;
        }

        .light-bottom h3 {
          font-size: 21px;
        }

        .modal {
          padding: 23px;
        }
      }

      @media(prefers-reduced-motion:reduce) {
        html {
          scroll-behavior: auto;
        }

        * {
          transition: none !important;
          animation: none !important;
        }
      }

      @media print {

        header,
        .hero,
        .filters,
        .tools,
        .search,
        .pagination,
        .batchbar,
        .edit-photo,
        .select-photo,
        dialog,
        .toast {
          display: none !important;
        }

        .gallery {
          display: block;
        }

        .gallery figure {
          break-inside: avoid;
          display: inline-block;
          vertical-align: top;
          width: 46%;
          margin: 0 2% 20px;
        }

        .photo-btn {
          aspect-ratio: auto;
        }

        .photo-btn img {
          height: 200px;
          object-fit: contain;
        }

        main {
          padding: 0;
        }

        .official-footer:before,
        .official-footer:after {
          display: none;
        }

        .section-top {
          margin-top: 0;
        }
      }

      /* 水墨背景 */
      .album-backdrop {
        background: #f2f7f3 url('水墨校园背景.png') center top/cover no-repeat;
        padding-bottom: 65px;
      }

      .album-backdrop .gallery figure {
        background: rgba(255, 255, 255, .78);
      }

      .album-backdrop+.official-footer {
        margin-top: 0;
      }

      .hero {
        height: 100svh;
        min-height: 0;
        max-height: none;
      }

      .hero .hero-wordmark {
        position: absolute;
        inset: 0;
        z-index: 1;
        margin: 0;
        padding: 0;
        display: grid;
        place-items: center;
      }

      .hero-wordmark a {
        display: block;
        width: clamp(140px, 30vw, 420px);
        max-width: 45vw;
        line-height: 0;
      }

      .hero-wordmark img {
        display: block;
        width: 100%;
        height: auto;
        filter: brightness(0) invert(1);
      }

      .hero:after {
        background: linear-gradient(#102e2730, #102e2755);
      }

      .section-top {
        padding-top: 20px;
        min-height: 165px;
      }

      .tools {
        position: static;
        justify-content: center;
        margin: 22px 0 25px;
      }

      .tools .plain {
        font-size: 13px;
        color: #217050;
      }

      .photo-title:empty,
      .light-bottom h3:empty {
        display: none;
      }

      .gallery figcaption:empty {
        display: none;
      }

      .official-footer {
        padding-top: 0;
      }

      .cover-nav {
        position: fixed;
        inset: 0 0 auto;
        height: 100px;
        padding: 20px 4.2%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        z-index: 20;
        border: 0;
        border-top: 3px solid transparent;
        border-image: linear-gradient(90deg, #ff8359, #efc33e) 1;
        background: linear-gradient(#163e33a6, transparent);
        transition: background .25s, box-shadow .25s;
      }

      .cover-nav.scrolled {
        background: #217050f5;
        box-shadow: 0 3px 18px #0a302a20;
      }

      .cover-nav .official-logo {
        width: 260px;
        height: auto;
        filter: none;
      }

      .cover-actions {
        position: relative;
        flex-shrink: 0;
      }

      .menu-toggle {
        width: 52px;
        height: 52px;
        padding: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1.5px solid #e1ad6a;
        border-radius: 43%;
        color: #e1ad6a;
        background: transparent;
        transition: background .2s;
      }

      .menu-toggle:hover,
      .menu-toggle[aria-expanded="false"] {
        background: #164a37bb;
      }

      .menu-toggle span {
        display: block;
        width: 23px;
        height: 2px;
        background: currentColor;
        transition: transform .2s, opacity .2s;
      }

      .menu-toggle[aria-expanded="false"] span:first-child {
        transform: translateY(8px) rotate(45deg);
      }

      .menu-toggle[aria-expanded="false"] span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle[aria-expanded="false"] span:last-child {
        transform: translateY(-8px) rotate(-45deg);
      }

      .cover-actions .tools {
        position: absolute;
        inset: calc(100% + 16px) 0 auto auto;
        z-index: 21;
        width: 190px;
        display: flex;
        flex-direction: column;
        gap: 0;
        align-items: stretch;
        margin: 0;
        padding: 8px 0;
        background: #fffdf6f7;
        border-top: 2px solid #ff8359;
        box-shadow: 0 8px 30px #0a302a30;
        backdrop-filter: blur(10px);
      }

      .cover-actions .tools:before {
        content: '';
        position: absolute;
        right: 19px;
        top: -9px;
        border: 7px solid transparent;
        border-bottom-color: #ff8359;
        border-top: 0;
      }

      .cover-actions .tools button,
      .cover-actions .tools .plain {
        width: 100%;
        text-align: left;
        font: 15px var(--serif);
        padding: 14px 22px;
        border: 0;
        background: none;
        color: #217050;
        margin: 0;
      }

      .cover-actions .tools button:hover,
      .cover-actions .tools button:focus-visible {
        background: #eaf1e7;
      }

      .section-top {
        min-height: 150px;
        padding-top: 20px;
        margin-bottom: 0;
      }

      @media(max-width:760px) {
        .cover-nav {
          height: 85px;
          padding: 16px 5%;
        }

        .cover-nav .official-logo {
          width: 210px;
        }

        .menu-toggle {
          width: 46px;
          height: 46px;
          padding: 11px;
        }

      @media(max-width:480px) {
        .cover-nav {
          height: 78px;
          padding: 14px 5%;

        .cover-nav .official-logo {
          width: 180px;

          transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle[aria-expanded="false"] span:last-child {
          transform: translateY(-7px) rotate(-45deg);
        }
      }

      @media print {
        .cover-nav {
          display: none;
        }
      }

          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        } [character]));

        function matchingPhotos() {
          return album.photos.filter(photo => {
            const inCategory = filter === '全部' || (filter === '未分类' ?
              photo.tags.length === 0 :
              photo.tags.includes(filter));
            const text = [photo.title, photo.caption, photo.filename, ...photo.tags]
              .join(' ').toLowerCase();
            return inCategory && (!query || text.includes(query));
          });
        }

        // 标签筛选与分页只改变显示结果，不修改照片分类。
        function renderFilters() {
          $('filters').innerHTML = ['全部', ...album.tags, '未分类'].map(name => {
            const count = name === '全部' ? album.photos.length : album.photos.filter(photo =>
              name === '未分类' ? photo.tags.length === 0 : photo.tags.includes(name)).length;
            return `<button class="chip ${filter === name ? 'active' : ''}" ` +
              `data-filter="${escape(name)}" aria-pressed="${filter === name}">` +
              `${escape(name)}<span>${count}</span></button>`;
          }).join('');
        }

        function photoCard(photo) {
          const title = photo.title || '校园照片';
          const details = [
            photo.tags.length ? '<div class="photo-kicker"><span class="tagtext">' +
            escape(photo.tags.join(' · ')) + '</span></div>' : '',
            photo.title ? `<h3 class="photo-title">${escape(photo.title)}</h3>` : '',
            photo.caption ? `<p class="photo-caption">${escape(photo.caption)}</p>` : ''
          ].join('');
          return `<figure data-id="${escape(photo.id)}">` +
            `<button class="photo-btn" data-view="${escape(photo.id)}" aria-label="查看 ${escape(title)}">` +
            `<img src="${escape(photo.thumb)}" loading="lazy" decoding="async" alt="${escape(title)}">` +
            '</button>' + (details ? `<figcaption>${details}</figcaption>` : '') + '</figure>';
        }

        function render() {
          renderFilters();
          const photos = matchingPhotos();
          const pages = Math.max(1, Math.ceil(photos.length / PAGE_SIZE));
          page = Math.min(page, pages);
          const visible = photos.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
          $('status').textContent = `${filter === '全部' ? '全部影像' : filter} / ${photos.length} 张`;
          $('gallery').innerHTML = visible.length ? visible.map(photoCard).join('') :
            '<div class="empty">' + (query ? '没有找到相关照片。' : '此分类暂无照片。') + '</div>';
          $('pageInfo').textContent = `${page} / ${pages}`;
          $('prevPage').disabled = page === 1;
          $('nextPage').disabled = page === pages;
          $('slideshow').disabled = photos.length === 0;
        }

        $('filters').onclick = event => {
          const button = event.target.closest('[data-filter]');
          if (!button) return;
          filter = button.dataset.filter;
          page = 1;
          render();
        };
        $('search').oninput = event => {
          query = event.target.value.trim().toLowerCase();
          page = 1;
          render();
        };
        $('gallery').onclick = event => {
          const button = event.target.closest('[data-view]');
          if (button) openViewer(button.dataset.view);
        };

        function changePage(direction) {
          page += direction;
          render();
          $('album').scrollIntoView({
            behavior: 'smooth'
          });
        }
        $('prevPage').onclick = () => changePage(-1);
        $('nextPage').onclick = () => changePage(1);

        // 照片放大、键盘切换和自动放映。
        function showPhoto() {
          const photo = viewerList[viewerIndex];
          $('viewerImage').src = photo.src;
          $('viewerImage').alt = photo.title || '校园照片';
          $('viewerTitle').textContent = photo.title || '';
          $('viewerCaption').textContent = [photo.tags.join(' · '), photo.caption]
            .filter(Boolean).join('\n');
          $('prevPhoto').disabled = viewerList.length < 2;
          $('nextPhoto').disabled = viewerList.length < 2;
          $('playPause').disabled = viewerList.length < 2;
        }

        function openViewer(id, auto = false) {
          viewerList = matchingPhotos();
          if (!viewerList.length) return;
          viewerIndex = Math.max(0, viewerList.findIndex(photo => photo.id === id));
          showPhoto();
          $('viewer').showModal();
          document.body.classList.add('no-scroll');
          if (auto && viewerList.length > 1) play();
        }

        function step(direction) {
          viewerIndex = (viewerIndex + direction + viewerList.length) % viewerList.length;
          showPhoto();
        }

        function stop() {
          clearInterval(timer);
          timer = null;
          $('playPause').textContent = '▷ 自动播放';
        }

        function play() {
          stop();
          timer = setInterval(() => step(1), 4500);
          $('playPause').textContent = 'Ⅱ 暂停播放';
        }

        $('playPause').onclick = () => timer ? stop() : play();
        $('prevPhoto').onclick = () => {
          stop();
          step(-1);
        };
        $('nextPhoto').onclick = () => {
          stop();
          step(1);
        };
        $('closeViewer').onclick = () => $('viewer').close();
        $('viewer').addEventListener('close', () => {
          stop();
          $('viewerImage').removeAttribute('src');
          document.body.classList.remove('no-scroll');
        });
        $('viewer').addEventListener('keydown', event => {
          if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
            event.preventDefault();
            stop();
            step(event.key === 'ArrowRight' ? 1 : -1);
          }
          if (event.code === 'Space' && event.target.tagName !== 'BUTTON' && viewerList.length >
            1) {
            event.preventDefault();
            timer ? stop() : play();
          }
        });
        $('viewer').addEventListener('click', event => {
          if (event.target !== $('viewer')) return;
          const bounds = $('viewer').getBoundingClientRect();
          if (event.clientX < bounds.left || event.clientX > bounds.right ||
            event.clientY < bounds.top || event.clientY > bounds.bottom) $('viewer').close();
        });
        $('slideshow').onclick = () => openViewer(matchingPhotos()[0]?.id, true);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) stop();
        });

        // 顶部菜单与首页。
        function setMenu(open, focus = false) {
          $('albumMenu').hidden = !open;
          $('menuToggle').setAttribute('aria-expanded', String(open));
          $('menuToggle').setAttribute('aria-label', open ? '关闭影集菜单' : '打开影集菜单');
          if (focus) $('menuToggle').focus();
        }
        $('menuToggle').onclick = () => setMenu($('albumMenu').hidden);
        $('albumMenu').addEventListener('click', event => {
          if (event.target.closest('button')) setMenu(false);
        });
        document.addEventListener('click', event => {
          if (!event.target.closest('.cover-actions')) setMenu(false);
        });
        document.addEventListener('keydown', event => {
          if (event.key === 'Escape' && !$('albumMenu').hidden) {
            setMenu(false, true);
            event.preventDefault();
          }
        });

        function updateCoverNav() {
          document.querySelector('.cover-nav').classList.toggle('scrolled', scrollY > 40);
        }
        addEventListener('scroll', updateCoverNav, {
          passive: true
        });
        document.addEventListener('error', event => {
          if (event.target.tagName === 'IMG') {
            event.target.alt = '图片未找到：请检查图片与 HTML 的相对位置，保留子文件夹结构';
          }
        }, true);

        const cover = album.photos.find(photo => photo.id === album.cover) || album.photos[0];
        $('cover').src = album.coverImage || cover?.src || '';
        document.querySelectorAll('[data-album-title]').forEach(element => {
          element.textContent = album.title;
        });
        $('credit').textContent = album.author || '';
        document.title = album.title + ' · 校园微影集';
        $('search').value = '';
        setMenu(false);
        updateCoverNav();
        render();
      })();
    </script>
  

</body></html>
